name = "maru-iken"
# 実行環境が対応している日付にする（未来の日付を書くと、環境によってはじかれる）
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# D1（データベース）の割り当て。
[[d1_databases]]
binding = "DB"
database_name = "maru-iken"
database_id = "ここを database_id に書きかえる"

# 秘密はここに書かない（雲の上の Settings > Variables and Secrets に入れる）。
# ・SESSION_SECRET … Cookie を まもる カギ（でぷろいのときに 自動で つくった）
# ・TEACHER_PASS   … 先生画面の 合言葉（deploy2.sh が つくって 入れる）

# 意見まとめの「同じ」判定のしきい値（0〜1）。大きいほど きびしく分ける。
SIMILARITY_THRESHOLD = "0.80"

# Workers AI（意見を「意味」でまとめるのに使う）
# バインド名は AI なので、コードからは env.AI で使える。
[ai]
binding = "AI"
