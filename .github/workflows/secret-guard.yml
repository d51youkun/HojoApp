# 秘密のカギが コミットされていないか 見はるかす番犬
#
# なぜ これが あるか：
#   yml やコードに トークンを 直接 書くと、GitHub に 保存され、
#   リポジトリを 公開した しゅんかんに 世界中から 見られる。
#   消しても、git の れきしに ずっと のこる。
#
#   「気をつける」では 防げない（人間は 必ず いつか やる）。
#   だから push のたびに 機械が 見はるかす。

name: 秘密のカギを 見はるかす

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: コミットずみのファイルを さがす
        run: |
          set -uo pipefail

          # さがす形（本物のトークンは ずっと長いので、{20,} の長さで さがす）
          PATTERN='cfut_[A-Za-z0-9_-]{20,}'
          PATTERN="${PATTERN}"'|cfat_[A-Za-z0-9_-]{20,}'
          PATTERN="${PATTERN}"'|ghp_[A-Za-z0-9]{30,}'
          PATTERN="${PATTERN}"'|github_pat_[A-Za-z0-9_]{30,}'
          PATTERN="${PATTERN}"'|sk-[A-Za-z0-9]{32,}'
          PATTERN="${PATTERN}"'|AKIA[0-9A-Z]{16}'

          echo "コミットずみのファイルだけを さがす（git grep は追跡ファイルだけ見る）"

          if git grep -nE "$PATTERN" -- . ':!*/secret-guard.yml'; then
            echo ""
            echo "::error::秘密のカギらしき文字列が コミットされています！"
            echo "::error::上のファイルと行を なおしてね（値は 消して、GitHub の Secrets に入れる）"
            echo "::error::すでに push してしまったら、そのカギを すぐ 失効（Roll / Delete）させてね"
            exit 1
          fi

          echo "✓ 見つからなかった。だいじょうぶ"
