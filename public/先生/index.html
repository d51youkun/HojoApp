<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まる意見｜先生用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A36; --ink2:#3E4E5C; --soft:#7A8B99; --hair:rgba(20,40,60,.10);
    --glass-hi:rgba(255,255,255,.74); --glass-lo:rgba(255,255,255,.46);
    --edge:rgba(255,255,255,.72); --edge-soft:rgba(255,255,255,.52);
    --inset:inset 0 1px 0 rgba(255,255,255,.82); --lift:0 16px 38px rgba(12,28,44,.14); --lift-sm:0 4px 14px rgba(12,28,44,.10);
    --r-lg:26px; --r-md:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;color:var(--ink);font-family:'Zen Maru Gothic',system-ui,sans-serif;
       background:linear-gradient(158deg,#EDF4FB 0%,#FBF3EE 48%,#F0F7F1 100%);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
       background:radial-gradient(38% 34% at 12% 8%,rgba(228,87,61,.16),transparent 70%),
                  radial-gradient(34% 32% at 88% 12%,rgba(43,108,163,.18),transparent 72%),
                  radial-gradient(42% 38% at 78% 88%,rgba(63,143,99,.16),transparent 72%);}
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:23px 18px 64px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:.04em;
         padding:9px 20px 9px 15px;border-radius:999px;background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
         -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
         border:1px solid var(--edge);box-shadow:var(--inset),var(--lift-sm);}
  .tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(43,108,163,.13);color:#2B6CA3}
  .who{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--soft);padding:7px 13px;border-radius:999px;
       background:rgba(255,255,255,.52);border:1px solid var(--edge-soft);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);}
  .who:empty{display:none}
  .who .nm{font-weight:700;color:var(--ink)}
  .linkbtn{background:rgba(255,255,255,.62);border:1px solid var(--edge-soft);border-radius:999px;padding:4px 11px;
           font:inherit;font-size:12px;color:var(--ink2);cursor:pointer}
  .center{background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));border:1px solid var(--edge);border-radius:var(--r-lg);
          padding:30px 22px;text-align:center;box-shadow:var(--inset),var(--lift);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);max-width:430px;margin:8vh auto 0}
  .center h2{margin:0 0 8px;font-size:19px}
  .center p{margin:0 0 16px;font-size:13.5px;color:var(--ink2);line-height:1.85}
  .passtxt{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--hair);font:inherit;font-size:16px;
           text-align:center;background:rgba(255,255,255,.92)}
  .go{margin-top:13px;width:100%;padding:15px;border:none;border-radius:16px;font:inherit;font-weight:900;font-size:16px;color:#fff;cursor:pointer;
      background:linear-gradient(180deg,#3E86C4,#245E93);box-shadow:var(--inset),0 10px 22px rgba(43,108,163,.34)}
  .notice{margin-top:12px;font-size:12.5px;color:var(--soft)}
  .errbox{color:#A62F19}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
  .head h1{margin:0;font-size:20px}
  .head .sub{font-size:12.5px;color:var(--soft);margin-top:3px}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--soft)}
  .dot{width:8px;height:8px;border-radius:50%;background:#4CA375;box-shadow:0 0 0 4px rgba(76,163,117,.18);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));border:1px solid var(--edge);border-radius:var(--r-md);
        padding:11px 16px;box-shadow:var(--inset),var(--lift-sm);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  .stat .k{font-size:11.5px;color:var(--soft)}
  .stat .v{font-weight:900;font-size:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}
  .pcard{background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));border:1px solid var(--edge);border-radius:22px;overflow:hidden;
         box-shadow:var(--inset),var(--lift-sm);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);position:relative}
  .pcard img{display:block;width:100%;height:190px;object-fit:cover;background:#fff}
  .pbody{padding:11px 13px 13px}
  .pname{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .ini{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:900;color:#fff;
       background:linear-gradient(180deg,#5C93C6,#31689B)}
  .pmeta{font-size:11.5px;color:var(--soft);margin-top:5px}
  .pcap{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:6px;word-break:break-word}
  .pdel{position:absolute;right:9px;top:9px;border:none;border-radius:999px;background:rgba(18,30,42,.6);color:#fff;font:inherit;font-size:11.5px;
        padding:6px 11px;cursor:pointer;backdrop-filter:blur(6px)}
  .pdel.arm{background:linear-gradient(180deg,#C8492E,#A62F19)}
  .empty{padding:56px 20px;text-align:center;color:var(--soft);font-size:13.5px;line-height:2;
         background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));border:1px solid var(--edge);border-radius:var(--r-lg);box-shadow:var(--inset),var(--lift-sm)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;z-index:90;
         background:rgba(24,38,52,.9);color:#fff;font-size:13.5px;padding:12px 20px;border-radius:999px;box-shadow:0 12px 30px rgba(12,28,44,.3);
         transition:opacity .22s,transform .22s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 52%),rgba(180,54,31,.88)}
  @media (max-width:560px){ .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px} .pcard img{height:150px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#2B6CA3" stroke-width="10"/>
        <circle cx="50" cy="50" r="15" fill="#E4573D"/>
      </svg>
      まる意見 <span class="tag">先生用</span>
    </div>
    <div class="who" id="whoBox"></div>
  </div>

  <section class="center" id="gateCard" style="display:none">
    <h2>先生用の 画面です</h2>
    <p>合言葉を 入れると、みんなが アップした 写真が 見られます。</p>
    <input class="passtxt" id="pass" type="password" placeholder="合言葉" autocomplete="off">
    <button class="go" id="goBtn" type="button">ひらく</button>
    <div class="notice" id="gateNotice"></div>
  </section>

  <section id="main" style="display:none">
    <div class="head">
      <div>
        <h1>アップされた 写真</h1>
        <div class="sub">子どもが えらんで おくった 写真が ならびます。おすと 大きく なります</div>
      </div>
      <div class="live"><span class="dot"></span><span id="liveTxt">じどうで こうしん中</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">写真の かず</div><div class="v"><span id="sCount">0</span></div></div>
      <div class="stat"><div class="k">さいしん</div><div class="v" style="font-size:17px;padding-top:5px" id="sTime">—</div></div>
    </div>
    <div id="gridHost"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = function(id){ return document.getElementById(id); };
const REFRESH_MS = 5000;
let photos = [];
let opened = false;
let timer = null;
let toastTimer = null;

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
  });
}
function initial(name){
  const n = String(name || "?").trim();
  return esc(n ? Array.from(n)[0] : "?");
}
function toast(msg, isError){
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isError);
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}
async function api(path, options){
  const res = await fetch(path, Object.assign({
    headers: { "content-type": "application/json" },
    credentials: "same-origin"
  }, options || {}));
  let data = null;
  try { data = await res.json(); } catch (e) {}
  return { res: res, data: data };
}

function render(){
  const host = $("gridHost");
  $("sCount").textContent = photos.length;
  if (!photos.length){
    host.innerHTML = '<div class="empty">まだ 写真が ありません。<br>子どもが 写真を アップすると、ここに ならびます。</div>';
    return;
  }
  let html = '<div class="grid">';
  photos.forEach(function(p){
    const when = String(p.created_at || "").slice(5, 16).replace("T", " ");
    html += '<div class="pcard">'
      + '<a href="/api/photo?id=' + encodeURIComponent(p.id) + '" target="_blank" rel="noopener">'
      + '<img src="/api/photo?id=' + encodeURIComponent(p.id) + '" alt="' + esc(p.name) + ' さんの 写真" loading="lazy"></a>'
      + '<button class="pdel" data-id="' + esc(String(p.id)) + '" type="button">けす</button>'
      + '<div class="pbody">'
      + '<div class="pname"><span class="ini">' + initial(p.name) + '</span>' + esc(p.name) + '</div>'
      + '<div class="pmeta">' + esc(when) + '</div>'
      + (p.caption ? '<div class="pcap">' + esc(p.caption) + '</div>' : '')
      + '</div></div>';
  });
  html += '</div>';
  host.innerHTML = html;

  Array.prototype.forEach.call(host.querySelectorAll(".pdel"), function(btn){
    btn.addEventListener("click", async function(ev){
      ev.preventDefault();
      if (btn.getAttribute("data-arm") !== "1"){
        btn.setAttribute("data-arm", "1");
        btn.textContent = "ほんとに？";
        btn.classList.add("arm");
        setTimeout(function(){
          if (btn.isConnected){ btn.removeAttribute("data-arm"); btn.textContent = "けす"; btn.classList.remove("arm"); }
        }, 4000);
        return;
      }
      btn.disabled = true;
      btn.textContent = "けしてる…";
      const r = await api("/api/photos", { method: "DELETE", body: JSON.stringify({ id: Number(btn.getAttribute("data-id")) }) });
      if (r.res.ok && r.data && r.data.ok){ toast("1まい けしたよ（" + (r.data.name || "") + "）"); await loadPhotos(); }
      else {
        toast((r.data && r.data.error) || "けせませんでした", true);
        btn.disabled = false; btn.textContent = "けす"; btn.removeAttribute("data-arm"); btn.classList.remove("arm");
      }
    });
  });
}

async function loadPhotos(){
  const r = await api("/api/photos");
  if (!r.res.ok){
    stopAuto();
    if (r.res.status === 401 || r.res.status === 403){ showGate((r.data && r.data.error) || ""); return; }
    $("liveTxt").textContent = "読みこめませんでした";
    return;
  }
  photos = (r.data && r.data.photos) || [];
  $("sTime").textContent = new Date().toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  $("liveTxt").textContent = "じどうで こうしん中";
  render();
  $("main").style.display = "block";
  $("gateCard").style.display = "none";
}
function startAuto(){ stopAuto(); timer = setInterval(loadPhotos, REFRESH_MS); }
function stopAuto(){ if (timer){ clearInterval(timer); timer = null; } }
document.addEventListener("visibilitychange", function(){
  if (document.hidden) stopAuto();
  else if (opened){ loadPhotos(); startAuto(); }
});

function showGate(msg){
  opened = false;
  stopAuto();
  $("main").style.display = "none";
  $("gateCard").style.display = "block";
  $("gateNotice").innerHTML = msg ? '<div class="errbox">' + esc(msg) + '</div>' : "";
  $("pass").focus();
}
function setWho(label){
  const box = $("whoBox");
  if (!label){ box.innerHTML = ""; return; }
  box.innerHTML = '<span class="nm"></span><button class="linkbtn" id="logoutBtn" type="button">とじる</button>';
  box.querySelector(".nm").textContent = label;
  $("logoutBtn").addEventListener("click", async function(){
    await api("/api/logout", { method: "POST" });
    location.reload();
  });
}
async function openGate(){
  const pass = $("pass").value.trim();
  if (!pass){ showGate("合言葉を 入れてね"); return; }
  const r = await api("/api/teacher", { method: "POST", body: JSON.stringify({ pass: pass }) });
  if (!r.data || !r.data.ok){ showGate((r.data && r.data.error) || "合言葉が ちがいます"); return; }
  $("pass").value = "";
  await boot();
}
$("goBtn").addEventListener("click", openGate);
$("pass").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); openGate(); } });

async function boot(){
  setWho("");
  try {
    await loadPhotos();
    if ($("main").style.display !== "none"){ opened = true; setWho("先生"); startAuto(); }
    else showGate("");
  } catch (e) {
    showGate("つながりませんでした。ページを ひらきなおしてね");
  }
}
window.addEventListener("load", boot);
</script>
</body>
</html>
